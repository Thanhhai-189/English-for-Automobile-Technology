<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive Assistant Chatbot</title>
    <style>
                /* --- RESET & CẤU HÌNH CHUNG --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
                /* --- TRANG CHỦ MÔ PHỎNG --- */
        .mg-landing-content {
            max-width: 600px;
            margin: 80px auto 0;
            text-align: center;
        }

        .mg-landing-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 1rem;
        }

        .mg-landing-desc {
            color: #64748b;
            font-style: italic;
            font-size: 0.95rem;
        }

        /* --- NÚT MỞ CHAT (FLOATING ACTION BUTTON) --- */
        #mg-chat-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 8px 20px -5px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #mg-chat-toggle:hover { transform: scale(1.1); }
        #mg-chat-toggle svg { width: 24px; height: 24px; }

        /* --- CỬA SỔ CHAT --- */
        #mg-chat-window {
            position: fixed;
            bottom: 5.5rem;
            right: 1.5rem;
            width: 380px;
            max-width: calc(100vw - 3rem);
            height: 600px;
            max-height: calc(100vh - 8rem);
            background: white;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.15);
            display: none;
            flex-direction: column;
            z-index: 1000;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            animation: mg-chat-fade 0.25s ease-out;
        }

        @keyframes mg-chat-fade {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Chat */
        .mg-chat-header {
            background: linear-gradient(to right, #1e3a8a, #2563eb);
            padding: 1rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .mg-header-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .mg-header-info h3 {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color:white;
        }

        .mg-close-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: color 0.2s;
        }

        .mg-close-btn:hover { color: white; }

        /* Vùng hiển thị tin nhắn */
        #mg-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background-color: #f8fafc;
        }

        .mg-message-row {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .mg-row-user { flex-direction: row-reverse; }

        .mg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .mg-avatar-bot { background: #eff6ff; border: 1px solid #dbeafe; }
        .mg-avatar-user { background: #e9e3c8; color: white; }

        .mg-msg {
            max-width: 85%;
            padding: 0.65rem 0.85rem;
            border-radius: 1rem;
            font-size: 0.875rem;
            line-height: 1.4;
        }

        .mg-msg-bot {
            background-color: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-top-left-radius: 0;
            text-align: left;
        }

        .mg-msg-user {
            background-color: #2563eb;
            color: white;
            border-top-right-radius: 0;
        }

        /* Card thông tin kỹ thuật */
        .mg-bot-card {
            border-radius: 0.75rem;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .mg-card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 0.5rem;
            margin-bottom: 0.75rem;
            border: 1px solid #e2e8f0;
            display: block;
        }

        .mg-card-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.25rem;
        }

        .mg-card-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: #1e3a8a;
        }

        .mg-card-ipa {
            color: #3b82f6;
            font-weight: 700;
            font-style: italic;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .mg-def-item {
            background: #f1f5f9;
            padding: 0.6rem;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            border-left: 4px solid #3b82f6;
        }

        .mg-def-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            color: #64748b;
            display: block;
            margin-bottom: 0.15rem;
        }

        .mg-def-text {
            font-size: 0.85rem;
            color: #334155;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Footer & Input Area */
        .mg-chat-footer {
            padding: 0.75rem;
            background: white;
            border-top: 1px solid #e2e8f0;
            position: relative;
        }

        .mg-input-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        #chat-input {
            flex: 1;
            padding: 0.6rem 1.25rem;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            outline: none;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }

        #chat-input:focus { border-color: #3b82f6; }

        .mg-send-btn {
            background-color: #2563eb;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .mg-send-btn:hover { background-color: #1d4ed8; }
        .mg-send-btn:disabled { background-color: #cbd5e1; cursor: default; }

        /* Autocomplete Suggestions */
        .mg-autocomplete-list {
            position: absolute;
            bottom: 100%;
            left: 0.75rem;
            right: 0.75rem;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
            box-shadow: 0 -10px 15px -3px rgba(0, 0, 0, 0.1);
            max-height: 180px;
            overflow-y: auto;
            display: none;
            z-index: 1001;
        }

        .mg-suggestion-item {
            padding: 0.6rem 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .mg-suggestion-item:last-child { border-bottom: none; }
        .mg-suggestion-item:hover, .mg-suggestion-item.active {
            background-color: #f0f7ff;
            color: #2563eb;
        }

        .mg-suggestion-icon { color: #94a3b8; font-size: 0.8rem; }

        /* Utility */
        .mg-audio-trigger {
            background: #2563eb;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .mg-italic-hint { font-style: italic; opacity: 0.6; font-size: 0.75rem; }

    </style>
</head>

            ],

                { keywords: ["thanks", "cam on", "ok", "hi", "hello"], reply: "Rất vui được hỗ trợ! 🤖" }
            ],
            fallback: [ "Tôi chưa tìm thấy thuật ngữ này. Hãy thử các thuật ngữ khác nhé! 🤖" ]
        };

        const AVATAR_BOT = `<div class="mg-avatar mg-avatar-bot">🤖</div>`;
        const AVATAR_USER = `<div class="mg-avatar mg-avatar-user">👤</div>`;

        // HÀM TÌM CỤM TỪ CHUẨN NHẤT
        const findBestMatch = (input, dictionary) => {
            const normalized = input.toLowerCase();

            return dictionary
                .flatMap(item =>
                    item.prompts.map(p => ({
                        prompt: p.toLowerCase(),
                        item
                    }))
                )
                .filter(p => normalized.includes(p.prompt))
                .sort((a, b) => b.prompt.length - a.prompt.length)[0]?.item;
        };

        function toggleChat() {
            const win = document.getElementById('mg-chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function initializeChat() {
            const inputField = document.getElementById("chat-input");
            const sendBtn = document.getElementById("send-btn");
            const suggestionList = document.getElementById("autocomplete-list");

            let currentFocus = -1;

            const allSuggestions = [];
            chatData.knowledgeBase.forEach(item => {
                item.prompts.forEach(p => allSuggestions.push(p));
            });

            function sendMessage() {
                const input = inputField.value.trim();
                if (input !== "") {
                    addUserMessage(input);
                    processResponse(input);
                    inputField.value = "";
                    sendBtn.disabled = true;
                    closeSuggestions();
                }
            }

            inputField.addEventListener("input", function() {
                const val = this.value;
                closeSuggestions();
                if (!val) return false;
                currentFocus = -1;

                const matches = allSuggestions.filter(s => s.toLowerCase().includes(val.toLowerCase())).slice(0, 5);
                
                if (matches.length > 0) {
                    suggestionList.style.display = "block";
                    matches.forEach((match, index) => {
                        const item = document.createElement("div");
                        item.className = "mg-suggestion-item";
                        item.innerHTML = `<span class="mg-suggestion-icon">🔍</span> <span>${match}</span>`;
                        item.addEventListener("click", function() {
                            inputField.value = match;
                            sendMessage();
                        });
                        suggestionList.appendChild(item);
                    });
                }
            });

            inputField.addEventListener("keydown", function(e) {
                const items = suggestionList.getElementsByClassName("mg-suggestion-item");
                if (e.key === "ArrowDown") {
                    currentFocus++;
                    addActive(items);
                } else if (e.key === "ArrowUp") {
                    currentFocus--;
                    addActive(items);
                } else if (e.key === "Enter") {
                    if (currentFocus > -1) {
                        if (items[currentFocus]) items[currentFocus].click();
                        e.preventDefault();
                    } else {
                        sendMessage();
                    }
                } else if (e.key === "Escape") {
                    closeSuggestions();
                }
            });

            function addActive(items) {
                if (!items) return false;
                removeActive(items);
                if (currentFocus >= items.length) currentFocus = 0;
                if (currentFocus < 0) currentFocus = items.length - 1;
                items[currentFocus].classList.add("active");
                items[currentFocus].scrollIntoView({ block: 'nearest' });
            }

            function removeActive(items) {
                for (let i = 0; i < items.length; i++) {
                    items[i].classList.remove("active");
                }
            }

            function closeSuggestions() {
                suggestionList.innerHTML = "";
                suggestionList.style.display = "none";
            }

            document.addEventListener("click", (e) => {
                if (e.target !== inputField) closeSuggestions();
            });

            sendBtn.addEventListener("click", sendMessage);
            inputField.addEventListener("input", () => { 
                sendBtn.disabled = inputField.value.trim() === ""; 
            });
            sendBtn.disabled = true;
        }

        function addUserMessage(text) {
            const container = document.getElementById("mg-messages");
            const row = document.createElement("div");
            row.className = "mg-message-row mg-row-user";
            row.innerHTML = `${AVATAR_USER}<div class="mg-msg mg-msg-user">${text}</div>`;
            container.appendChild(row);
            
            const botRow = document.createElement("div");
            botRow.className = "mg-message-row";
            botRow.id = "mg-bot-temp";
            botRow.innerHTML = `${AVATAR_BOT}<div class="mg-msg mg-msg-bot italic opacity-60 text-xs">Thinking...</div>`;
            container.appendChild(botRow);
            
            container.scrollTop = container.scrollHeight;
        }

        function strnormalize(str) {
            let AccentsMap = ["aàảãáạăằẳẵắặâầẩẫấậ", "dđ", "eèẻẽéẹêềểễếệ", "iìỉĩíị", "oòỏõóọôồổỗốộơờởỡớợ", "uùủũúụưừửữứự", "yỳỷỹýỵ"];
            for (let i = 0; i < AccentsMap.length; i++) {
                let re = new RegExp('[' + AccentsMap[i].substr(1) + ']', 'g');
                str = str.replace(re, AccentsMap[i][0]);
            }
            return str.replace(/\s+/g, ' ').trim().toLowerCase();
        }

        function processResponse(input) {
            const text = strnormalize(input);
            let result = null;

            // Kiểm tra các trường hợp đặc biệt (chào hỏi)
            for (const item of chatData.specialCases) {
                if (item.keywords.some(k => text.includes(k))) { 
                    result = item.reply; 
                    break; 
                }
            }

            // Sử dụng findBestMatch để tìm thuật ngữ kỹ thuật
            if (!result) {
                const match = findBestMatch(text, chatData.knowledgeBase);
                if (match) result = match.data;
            }

            if (!result) result = chatData.fallback[0];

            setTimeout(() => { renderBotMessage(result); }, 400);
        }

        function renderBotMessage(data) {
            const botRow = document.getElementById("mg-bot-temp");
            if (!botRow) return;
            botRow.id = "";
            const msgBox = botRow.querySelector(".mg-msg");
            msgBox.classList.remove("italic", "opacity-60", "text-xs");
            
            if (typeof data === 'string') {
                msgBox.innerHTML = data;
            } else {
                const imageHtml = (data.img && data.img.trim() !== "") 
                    ? `<img src="${data.img}" class="mg-card-img" alt="${data.term}" onerror="this.remove()">` 
                    : "";

                msgBox.innerHTML = `
                    <div class="mg-bot-card">
                        ${imageHtml}
                        <div class="mg-card-title-row">
                            <h4 class="mg-card-title">${data.term}</h4>
                            <div class="mg-audio-trigger" onclick="speak('${data.term}')">🔊</div>
                        </div>
                        <div class="mg-card-ipa">${data.ipa}</div>
                        <div class="mg-def-item">
                            <span class="mg-def-label">English</span>
                            <p class="mg-def-text">${data.en}</p>
                        </div>
                        <div class="mg-def-item !border-slate-400">
                            <span class="mg-def-label">Tiếng Việt</span>
                            <p class="mg-def-text">${data.vi}</p>
                        </div>
                    </div>
                `;
            }
            document.getElementById("mg-messages").scrollTop = document.getElementById("mg-messages").scrollHeight;
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        document.addEventListener("DOMContentLoaded", initializeChat);
    
    </script>
</body>
</html>
